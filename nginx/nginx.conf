events {
    worker_connections 2048;
}

http {
    # ── Upstream definitions ──
    upstream app_api {
        server localhost:8080;
        keepalive 64;
    }

    upstream litellm_proxy {
        server localhost:4000;
        keepalive 64;
    }

    # ── Rate limiting ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=30r/m;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ── Main server ──
    server {
        listen 80;
        server_name _;

        # Max upload size (for document ingestion)
        client_max_body_size 100M;

        # ── Platform API ──
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://app_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE streaming support for chat
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }

        # ── Health check ──
        location /health {
            proxy_pass http://app_api;
        }

        # ── LiteLLM direct access (OpenAI-compatible) ──
        # Users can also hit this directly with their LiteLLM keys
        location /v1/ {
            limit_req zone=chat_limit burst=10 nodelay;
            proxy_pass http://litellm_proxy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Streaming support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            chunked_transfer_encoding on;
        }

        # ── Docs ──
        location /docs {
            proxy_pass http://app_api;
        }
        location /redoc {
            proxy_pass http://app_api;
        }
        location /openapi.json {
            proxy_pass http://app_api;
        }

        # ── Root ──
        location / {
            proxy_pass http://app_api;
        }
    }

    # ── Optional: HTTPS server (uncomment and configure) ──
    # server {
    #     listen 443 ssl http2;
    #     server_name llm.internal.company.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #
    #     # ... same location blocks as above ...
    # }
}
